<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>3D 아트 미리보기</title>
<style>
  body{margin:0;background:#FFF6F9;font-family:'Apple SD Gothic Neo',sans-serif;color:#5C3D35}
  .row{display:flex;gap:22px;padding:18px;align-items:flex-end;flex-wrap:wrap}
  .cell{text-align:center}
  .cell p{font-weight:900;font-size:13px;margin:6px 0 0}
  .machine-art{width:260px}
  .capsule-art{width:260px;display:block}
  .gift-art{width:320px;display:block}
  .coin-art{width:64px;display:block}
  .dark{background:#3A1030}
</style></head>
<body>
<div class="row" id="row1"></div>
<div class="row" id="row2"></div>
<script>
fetch('coupon.html?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
  var blocks = t.match(/<script>[\s\S]*?<\/script>/g);
  var code = blocks[blocks.length-1].replace(/^<script>/,'').replace(/<\/script>$/,'');
  var sc = document.createElement('script'); sc.textContent = code;
  window.addEventListener('error', function(e){ e.preventDefault(); }, true);
  document.body.appendChild(sc);
  var tries = 0;
  (function go(){
    if(typeof machineSVG === 'function'){ render(); return; }
    if(tries++ > 60) { document.body.insertAdjacentHTML('beforeend','<p>load failed</p>'); return; }
    setTimeout(go, 100);
  })();
  function render(){
    var r1 = document.getElementById('row1');
    r1.innerHTML =
        '<div class="cell"><div class="machine-art">'+machineSVG('gift')+'</div><p>선물 뽑기</p></div>'
      + '<div class="cell"><div class="machine-art">'+machineSVG('heart')+'</div><p>마음 뽑기</p></div>'
      + '<div class="cell dark" style="padding:14px;border-radius:18px"><div class="capsule-art">'+capsuleSVG('gift')+'</div><p style="color:#fff">선물 캡슐</p></div>'
      + '<div class="cell dark" style="padding:14px;border-radius:18px"><div class="capsule-art">'+capsuleSVG('heart')+'</div><p style="color:#fff">마음 캡슐</p></div>';
    var r2 = document.getElementById('row2');
    r2.innerHTML =
        '<div class="cell dark" style="padding:14px;border-radius:18px"><div class="gift-art">'+giftBoxSVG()+'</div><p style="color:#fff">선물 상자</p></div>'
      + '<div class="cell"><div style="display:flex;gap:16px;align-items:center">'
      +   '<div class="coin-art">'+coinSVG('heart')+'</div><div class="coin-art">'+coinSVG('gift')+'</div>'
      + '</div><p>코인 64px</p>'
      +   '<div style="display:flex;gap:14px;align-items:center;margin-top:10px">'
      +   '<div style="width:25px;height:25px">'+coinSVG('heart')+'</div><div style="width:25px;height:25px">'+coinSVG('gift')+'</div>'
      + '</div><p>코인 25px</p></div>';
  }
});
</script>
</body></html>
