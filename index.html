<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="큐트 아케이드 파이터 🎮" />
  <meta property="og:description" content="귀여운 픽셀 동물들과 함께하는 오락실 대전 게임! 혼자서도, 친구랑 온라인으로도 같이 해보세요!" />
  <meta property="og:image" content="https://agentzepeto-dev.github.io/-/cover.png" />
  <meta property="og:url" content="https://agentzepeto-dev.github.io/-/" />
  <title>CUTE ARCADE FIGHTER</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 20%, #24193d 0%, #09070f 85%);
    color: #fff;
    font-family: "Courier New", "Apple SD Gothic Neo", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    overflow-x: hidden;
    padding: 2px;
  }

  /* Real 3D Arcade Cabinet Shell */
  .arcade-cabinet {
    position: relative;
    width: 100%;
    max-width: 980px;
    background: linear-gradient(90deg, #1b1330 0%, #312454 6%, #312454 94%, #150e26 100%);
    border-radius: 20px 20px 14px 14px;
    padding: 0 8px 8px;
    box-shadow:
      -12px 0 0 #18102b,
      12px 0 0 #100b1d,
      0 28px 60px rgba(0, 0, 0, 0.9),
      inset 0 2px 6px rgba(255, 255, 255, 0.14);
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* 3D Angled Marquee Canopy */
  .marquee-hood {
    margin: 0 -18px;
    padding: 5px 12px 4px;
    background: linear-gradient(180deg, #4b397d 0%, #291e47 100%);
    border-top: 4px solid #7d67bf;
    border-bottom: 5px solid #120c21;
    border-radius: 18px 18px 6px 6px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.55);

  }
  .marquee {
    height: 20px;
    background: linear-gradient(90deg, #ff4d6d, #ffd166, #4cc9f0, #ff4d6d);
    border-radius: 6px;
    border: 3px solid #140e24;
    box-shadow:
      0 0 18px rgba(255, 209, 102, 0.55),
      inset 0 3px 6px rgba(255, 255, 255, 0.55),
      inset 0 -3px 6px rgba(0, 0, 0, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.96rem;
    font-weight: 900;
    letter-spacing: 0.22em;
    color: #161029;
  }
  /* Speaker Grille under Marquee */
  .speaker-grille {
    margin: 6px auto 0;
    width: 56%;
    height: 8px;
    background: repeating-linear-gradient(
      90deg,
      #100b1d 0px,
      #100b1d 5px,
      transparent 5px,
      transparent 10px
    );
    border-radius: 4px;
    opacity: 0.85;
  }

  /* Deeply Recessed CRT Monitor Bay */
  .monitor-bay {
    background: linear-gradient(180deg, #100b1c 0%, #1d1533 100%);
    padding: 5px 6px 6px;
    margin: 0 -4px;
    border-left: 6px solid #140e24;
    border-right: 6px solid #0c0817;
    box-shadow: inset 0 14px 24px rgba(0, 0, 0, 0.85);
  }
  .screen-bezel {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #07050c;
    border-top: 6px solid #0b0814;
    border-left: 6px solid #140f24;
    border-right: 6px solid #0a0712;
    border-bottom: 6px solid #261d40;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      inset 0 0 34px rgba(0, 0, 0, 0.98),
      0 2px 0 rgba(255, 255, 255, 0.08);
  }
  /* CRT Glass Curvature Glare + Scanlines */
  .screen-bezel::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 22% 16%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.02) 38%, transparent 65%);
    pointer-events: none;
    z-index: 6;
  }
  .screen-bezel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.03) 0px,
      rgba(255, 255, 255, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 4;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(10, 7, 20, 0.62);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    gap: 8px;
  }
  .overlay.hidden { display: none; }
  .arcade-logo {
    font-size: 1.25rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #ffd166;
    text-shadow: 2px 2px 0 #8c1c39;
    margin: 0;
  }
  .overlay p {
    margin: 0;
    font-size: 0.95rem;
    color: #e4dcf5;
    max-width: 280px;
    line-height: 1.4;
  }
  .ov-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .start-btn {
    background: #e03e66;
    color: #fff;
    border: 2px solid #ffd166;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 0.96rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 3px 0 #7a142d;
  }
  .start-btn.secondary {
    background: #3858d6;
    box-shadow: 0 3px 0 #1b2c75;
  }
  .start-btn:active { transform: translateY(2px); }

  /* 3D Sloped Control Deck jutting forward */
  .arcade-deck {
    margin: 0 -20px;
    background: linear-gradient(180deg, #3c2f63 0%, #261d42 78%, #161029 100%);
    border-top: 4px solid #7d68bf;
    border-left: 6px solid #2b204a;
    border-right: 6px solid #161029;
    border-bottom: 12px solid #100b1f;
    border-radius: 10px 10px 18px 18px;
    padding: 12px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow:
      0 14px 26px rgba(0, 0, 0, 0.7),
      inset 0 3px 6px rgba(255, 255, 255, 0.18);

  }
  .deck-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .coin-slot {
    background: #0d0917;
    border: 2px solid #ffd166;
    color: #ffd166;
    border-radius: 6px;
    padding: 3px 10px;
    font-weight: 900;
    font-size: 0.96rem;
    letter-spacing: 0.06em;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
  }
  .deck-btns { display: flex; gap: 6px; }
  .mini-btn, .start-btn, .ctrl-btn, .p2-mini { touch-action: manipulation; }
  .mini-btn {
    background: #372c57;
    color: #fff;
    border: 2px solid #635196;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.76rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 0 #181229;
  }
  .mini-btn.shop {
    background: #de3c66;
    border-color: #ffb3c6;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    touch-action: none;
  }
  .joystick-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .joystick-base {
    position: relative;
    width: 116px;
    height: 116px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #0d0917 0%, #241b38 68%, #47386e 100%);
    border: 4px solid #6956a1;
    box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.9), 0 6px 12px rgba(0, 0, 0, 0.6);
    touch-action: none;
  }
  .joystick-ring {
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    border: 1.5px dashed rgba(255, 209, 102, 0.28);
    pointer-events: none;
  }
  .joystick-shaft {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    background: radial-gradient(circle at 30% 30%, #e0e4f0, #6c738a);
    border-radius: 50%;
    pointer-events: none;
  }
  .joystick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    margin: -24px 0 0 -24px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #ffc2d1 0%, #ff3b6b 45%, #8c1130 100%);
    border: 2px solid #ffd6e0;
    box-shadow: 0 8px 14px rgba(0, 0, 0, 0.78);
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  .stick-hint { font-size: 0.68rem; color: #d0c6eb; }

  .actions {
    display: grid;
    grid-template-columns: repeat(2, 82px);
    grid-template-rows: 56px 56px;
    gap: 10px;
  }
  .ctrl-btn {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid #635296;
    color: #fff;
    font-weight: 900;
    font-size: 1.02rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 0 #120d1f, 0 8px 12px rgba(0,0,0,0.45);
  }
  .ctrl-btn:active, .ctrl-btn.pressed {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #120d1f;
    filter: brightness(1.18);
  }
  .btn-punch { background: radial-gradient(circle at 35% 30%, #ff85a1, #d6365c); border-color: #ffc2d1; }
  .btn-kick { background: radial-gradient(circle at 35% 30%, #ffc078, #e07016); border-color: #ffe8cc; }
  .btn-dodge { background: radial-gradient(circle at 35% 30%, #74c0fc, #228be6); border-color: #d0ebff; }
  .btn-special { background: radial-gradient(circle at 35% 30%, #ffe066, #f08c00); border-color: #fff3bf; color: #2b1800; }

  /* Lower Coin Door Panel */
  .coin-door {
    margin-top: 8px;
    padding: 4px 10px;
    background: linear-gradient(180deg, #1b142e 0%, #100b1c 100%);
    border-top: 3px solid #3c2f61;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .coin-plate {
    background: #0a0712;
    border: 2px solid #4d3e75;
    border-radius: 5px;
    padding: 3px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.68rem;
    font-weight: 900;
    color: #ff6b8b;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9);
  }
  .coin-slit {
    width: 6px;
    height: 16px;
    background: #000;
    border: 1px solid #ff4d6d;
    box-shadow: 0 0 6px rgba(255, 77, 109, 0.7);
  }

  .shop-modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(10, 7, 20, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .shop-modal.hidden { display: none; }
  .shop-box {
    width: 100%;
    max-width: 680px;
    max-height: 88dvh;
    background: #231b38;
    border: 3px solid #635196;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shop-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid #413366;
    background: #2d2247;
  }
  .shop-head h2 { margin: 0; font-size: 0.96rem; color: #ffd166; }
  .shop-grid {
    padding: 12px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }
  .char-card {
    background: #2f254a;
    border: 2px solid #4d3e75;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-align: center;
  }
  .char-card.selected { border-color: #ffd166; background: #3b2f5c; }
  .portrait {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    background: #1b152c;
    border: 2px solid #6c59a3;
    image-rendering: pixelated;
  }
  .char-name { font-weight: 800; font-size: 1rem; }
  .char-role { font-size: 0.95rem; color: #cbbfe8; }
  .char-stats {
    width: 100%;
    font-size: 0.82rem;
    color: #ffd166;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    padding: 4px;
  }
  .char-btn {
    width: 100%;
    margin-top: auto;
    border: none;
    border-radius: 6px;
    padding: 7px;
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
    color: #fff;
  }
  .char-btn.use { background: #5ce1e6; color: #161224; }
  .char-btn.using { background: #ffd166; color: #161224; }
  .char-btn.buy { background: #ff6b8b; }
  .char-btn.locked { background: #4b4166; color: #a79cc4; cursor: not-allowed; }

  @media (max-width: 480px) {
    .arcade-cabinet { padding: 0 10px 10px; }
    .marquee-hood { margin: 0 -10px; padding: 8px 12px 6px; }
    .arcade-deck { margin: 0 -12px; padding: 10px 12px 12px; }
    .joystick-base { width: 102px; height: 102px; }
    .actions { grid-template-columns: repeat(2, 74px); grid-template-rows: 52px 52px; gap: 8px; }
  }

  .two-p-controls {
    display: none;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    touch-action: none;
  }
  .two-p-controls.active { display: flex; }
  .controls.hidden { display: none; }
  .p-pad {
    flex: 1;
    background: rgba(15, 11, 28, 0.55);
    border: 2px solid #4d3e75;
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .p-pad-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 900;
    color: #5ce1e6;
  }
  .p-pad.p2 .p-pad-head { color: #ff8fab; }
  .p-pad-row {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  .p2-mini {
    flex: 1;
    height: 36px;
    border-radius: 7px;
    border: 2px solid #635296;
    background: #372c57;
    color: #fff;
    font-weight: 900;
    font-size: 0.78rem;
    cursor: pointer;
    box-shadow: 0 3px 0 #140f22;
  }
  .p2-mini:active, .p2-mini.pressed { transform: translateY(2px); filter: brightness(1.2); }
  .p2-mini.atk { background: #c92a54; border-color: #ffb3c6; }
  .p2-mini.kick { background: #d96b14; border-color: #ffe8cc; }
  .p2-mini.spec { background: #e69d00; border-color: #fff3bf; color: #2b1800; }


  /* Phone Landscape Fit: show BOTH screen and controls together without scrolling */
  @media (max-height: 560px) and (orientation: landscape) {
    body { padding: 2px; height: 100dvh; overflow: hidden; }
    .arcade-cabinet {
      height: 98dvh;
      max-height: 98dvh;
      max-width: 100%;
      padding: 4px 8px;
      justify-content: space-between;
      gap: 4px;
    }
    .marquee-hood, .coin-door { display: none; }
    .monitor-bay {
      flex: 1;
      min-height: 0;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-bezel {
      height: 100%;
      width: auto;
      max-width: 100%;
      aspect-ratio: 16 / 10;
    }
    .arcade-deck {
      margin: 0;
      padding: 4px 8px;
      gap: 4px;
    }
    .deck-strip { gap: 4px; }
    .mini-btn, .coin-slot { padding: 2px 7px; font-size: 0.72rem; }
    .joystick-base { width: 76px; height: 76px; }
    .joystick-knob { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
    .stick-hint { display: none; }
    .actions { grid-template-columns: repeat(2, 54px); grid-template-rows: 34px 34px; gap: 5px; }
    .ctrl-btn { font-size: 0.78rem; }
    .p-pad { padding: 3px 5px; gap: 3px; }
    .p2-mini { height: 28px; font-size: 0.72rem; }
  }

  /* Manual Screen Size Modes (affects screen itself on both portrait & landscape) */
  .arcade-cabinet.size-lg .monitor-bay { flex: 2.4 !important; }
  .arcade-cabinet.size-lg .screen-bezel { width: 100% !important; aspect-ratio: 4 / 3 !important; }
  .arcade-cabinet.size-md .monitor-bay { flex: 1.5 !important; }
  .arcade-cabinet.size-md .screen-bezel { width: 92% !important; margin: 0 auto; aspect-ratio: 16 / 10 !important; }
  .arcade-cabinet.size-sm .monitor-bay { flex: 1.0 !important; }
  .arcade-cabinet.size-sm .screen-bezel { width: 76% !important; margin: 0 auto; aspect-ratio: 16 / 9 !important; }
  @media (max-height: 560px) and (orientation: landscape) {
    .arcade-cabinet.size-lg .screen-bezel { height: 100% !important; width: auto !important; max-width: 100% !important; aspect-ratio: 16 / 10 !important; }
    .arcade-cabinet.size-lg .p2-mini { height: 24px !important; font-size: 0.68rem !important; }
    .arcade-cabinet.size-lg .arcade-deck { padding: 3px 6px !important; }
    .arcade-cabinet.size-md .screen-bezel { height: 92% !important; width: auto !important; max-width: 100% !important; aspect-ratio: 16 / 10 !important; }
    .arcade-cabinet.size-sm .screen-bezel { height: 80% !important; width: auto !important; max-width: 100% !important; aspect-ratio: 16 / 10 !important; }
  }


  /* When size-lg is chosen while phone is upright (portrait), rotate cabinet 90deg into full horizontal screen */
  @media (orientation: portrait) {
    body.force-landscape {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #07050c;
    }
    body.force-landscape .arcade-cabinet.size-lg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100dvh;
      height: 100vw;
      max-width: none;
      max-height: none;
      transform: translate(-50%, -50%) rotate(90deg);
      padding: 4px 10px;
      gap: 4px;
      justify-content: space-between;
      border-radius: 10px;
    }
    body.force-landscape .marquee-hood,
    body.force-landscape .coin-door { display: none; }
    body.force-landscape .monitor-bay {
      flex: 2.2;
      min-height: 0;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.force-landscape .screen-bezel {
      height: 100% !important;
      width: auto !important;
      max-width: 100% !important;
      aspect-ratio: 16 / 10 !important;
    }
    body.force-landscape .arcade-deck {
      margin: 0;
      padding: 4px 8px;
      gap: 4px;
    }
    body.force-landscape .joystick-base { width: 78px; height: 78px; }
    body.force-landscape .joystick-knob { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
    body.force-landscape .stick-hint { display: none; }
    body.force-landscape .actions { grid-template-columns: repeat(2, 56px); grid-template-rows: 34px 34px; gap: 5px; }
    body.force-landscape .p2-mini { height: 26px !important; font-size: 0.7rem !important; }
  }


  /* True 100% edge-to-edge screen fill for size-lg and landscape */
  .arcade-cabinet.size-lg {
    max-width: 100vw !important;
    width: 100vw !important;
    padding: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  .arcade-cabinet.size-lg .marquee-hood,
  .arcade-cabinet.size-lg .coin-door { display: none !important; }
  .arcade-cabinet.size-lg .monitor-bay {
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }
  .arcade-cabinet.size-lg .screen-bezel {
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    border: none !important;
    border-radius: 0 !important;
  }
  @media (orientation: landscape) {
    .arcade-cabinet.size-lg {
      height: 100dvh !important;
    }
    .arcade-cabinet.size-lg .monitor-bay {
      flex: 1 1 auto !important;
      height: auto !important;
      min-height: 0 !important;
    }
  }
  @media (orientation: portrait) {
    body.force-landscape .arcade-cabinet.size-lg {
      width: 100dvh !important;
      height: 100vw !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }
    body.force-landscape .monitor-bay {
      flex: 1 1 auto !important;
      width: 100% !important;
      min-height: 0 !important;
      padding: 0 !important;
    }
    body.force-landscape .screen-bezel {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      aspect-ratio: auto !important;
    }
  }


  .arcade-deck { touch-action: none; }

function getOpponentForStage(idx) {
  const base = OPP_POOL[idx % OPP_POOL.length];
  const theme = ARENA_THEMES[idx % ARENA_THEMES.length];
  const weak = WEAK_LIST[idx % WEAK_LIST.length];
  const tier = Math.floor(idx / OPP_POOL.length);
  const titlePrefix = tier > 0 ? `Lv.${idx + 1} ` : '';
  return {
    ...base,
    ...theme,
    ...weak,
    name: `${titlePrefix}${base.name}`,
    hp: Math.round(95 + idx * 10),
    atk: Number((0.72 + Math.min(2.4, idx * 0.035)).toFixed(2)),
    spd: Number((3.1 + Math.min(2.8, idx * 0.06)).toFixed(2)),
    aggr: Number((0.038 + Math.min(0.065, idx * 0.002)).toFixed(3)),
    dodgeRate: Number((0.12 + Math.min(0.36, idx * 0.01)).toFixed(2)),
    specPower: Math.round(16 + Math.min(72, idx * 1.2)),
    specCount: idx >= 20 ? 2 : 1,
    specSize: Math.min(34, 14 + Math.floor(idx * 0.4))
  };
}

const SAVE_KEY = 'cute_arcade_fighter_v4';

function loadSaveData() {
  const sources = [];
  try {
    if (location.hash && location.hash.startsWith('#save=')) {
      sources.push(decodeURIComponent(location.hash.slice(6)));
    }
  } catch (e) {}
  try {
    const ls = localStorage.getItem(SAVE_KEY);
    if (ls) sources.push(ls);
  } catch (e) {}
  try {
    if (window.name && window.name.startsWith('CAF_SAVE:')) {
      sources.push(window.name.slice(9));
    }
  } catch (e) {}
  for (const raw of sources) {
    try {
      const parsed = JSON.parse(raw);
      if (typeof parsed.coins === 'number') save.coins = parsed.coins;
      if (Array.isArray(parsed.unlocked)) save.unlocked = parsed.unlocked;
      if (parsed.selected) save.selected = parsed.selected;
      if (typeof parsed.stage === 'number' && parsed.stage >= 0) save.stage = parsed.stage;
      break;
    } catch (e) {}
  }
}
loadSaveData();

function persistSave() {
  const json = JSON.stringify(save);
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  try { window.name = 'CAF_SAVE:' + json; } catch (e) {}
  try { history.replaceState(null, '', '#save=' + encodeURIComponent(json)); } catch (e) {}
  updateCoinUI();
}

function ensureAudio() {
  if (!soundOn) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}

function beep(freq, dur, type = 'square', vol = 0.08, slideTo = null) {
  const ctxA = ensureAudio();
  if (!ctxA) return;
  const now = ctxA.currentTime;
  const osc = ctxA.createOscillator();
  const gain = ctxA.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain);
  gain.connect(ctxA.destination);
  osc.start(now);
  osc.stop(now + dur);
}

function noiseHit(dur = 0.09, vol = 0.14) {
  const ctxA = ensureAudio();
  if (!ctxA) return;
  const bufSize = Math.floor(ctxA.sampleRate * dur);
  const buf = ctxA.createBuffer(1, bufSize, ctxA.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = ctxA.createBufferSource();
  src.buffer = buf;
  const filter = ctxA.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1100;
  const gain = ctxA.createGain();
  gain.gain.value = vol;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctxA.destination);
  src.start();
}

function startDodge(f) {
  if (f.dodgeCooldown > 0 || f.state === 'hit' || f.state === 'ko' || f.y < GROUND_Y) return;
  f.state = 'dodge';
  f.stateTime = 18;
  f.dodgeCooldown = 28;
  f.vx = -f.dir * 8.2;
  beep(420, 0.06, 'sine', 0.05);
}

function startAttack(f, kind) {
  if (f.state === 'hit' || f.state === 'ko' || f.state === 'punch' || f.state === 'kick' || f.state === 'special') return;
  if (kind === 'special') {
    if (f.energy < 100) return;
    f.energy = 0;
    f.state = 'special';
    f.stateTime = 24;
    beep(720, 0.16, 'sine', 0.1);
    for (let i = 0; i < f.specCount; i++) {
      setTimeout(() => {
        if (gameState !== 'fight') return;
        projectiles.push({
          owner: f,
          x: f.x + f.dir * 38,
          y: f.y - 54 - (i * 8),
          vx: f.dir * (9.5 + i * 0.8),
          color: f.specColor,
          power: f.specPower,
          size: f.specSize,
          life: 58
        });
        if (i > 0) beep(760 + i * 110, 0.1, 'sine', 0.08);
      }, i * 140);
    }
    return;
  }
  f.state = kind;
  f.isSpinKick = (kind === 'kick' && f.y < GROUND_Y - 6);
  f.stateTime = kind === 'punch' ? 15 : (f.isSpinKick ? 24 : 21);
  if (kind === 'kick') f.vx = f.dir * (f.isSpinKick ? 5.2 : 3.2);
  f.hitApplied = false;
  beep(f.isSpinKick ? 340 : (kind === 'punch' ? 280 : 210), 0.08, 'triangle', 0.08, f.isSpinKick ? 540 : null);
}

function applyDamage(attacker, defender, baseDmg, knock, label) {
  if (defender.state !== 'dodge') {
    attacker.combo = (attacker.combo || 0) + 1;
    attacker.comboTimer = 95;
  }
  if (defender.state === 'dodge') {
    addPopup(defender.x, defender.y - 110, '피했다!', '#74c0fc', 19);
    return;
  }
  const dmg = Math.round(baseDmg * attacker.atk);
  defender.hp = Math.max(0, defender.hp - dmg);
  defender.vx = attacker.dir * knock;
  attacker.energy = Math.min(100, attacker.energy + 20);
  defender.energy = Math.min(100, defender.energy + 12);

  defender.state = defender.hp <= 0 ? 'ko' : 'hit';
  defender.stateTime = defender.hp <= 0 ? 60 : 13;
  shake = Math.min(12, dmg * 0.5);
  spawnSparks(defender.x, defender.y - 55, '#ffd166', 12);
  const comboTxt = attacker.combo >= 2 ? ` (${attacker.combo} COMBO!)` : '';
  addPopup(defender.x, defender.y - 122, `${label} -${dmg}${comboTxt}`, attacker.combo >= 3 ? '#5ce1e6' : '#ff8fab', attacker.combo >= 3 ? 25 : 21);
  playHitSfx(dmg >= 20);

  if (defender.hp <= 0) {
    defender.state = 'ko';
    defender.vy = -5.5;
    endRound(attacker.isPlayer);
  }
}

  }

  const opp = getOpponentForStage(stageIdx);
  const earned = playerWon ? 2 : 0;
  if (earned > 0) {
    save.coins += earned;
  }
  if (playerWon) {
    save.stage = stageIdx + 1;
  }
  persistSave();

  setTimeout(() => {
    overlay.classList.remove('hidden');
    if (playerWon) {
      ovTitle.textContent = `🏆 승! STAGE ${stageIdx + 1} 클리어 (+2 COIN)`;
      ovDesc.textContent = `${opp.name} 상대를 이겼어요! 다음 STAGE ${stageIdx + 2} 도전!`;
      ovBtn.textContent = `STAGE ${stageIdx + 2} 계속하기`;
      ovBtn.onclick = () => startRound(stageIdx + 1);
    } else {
      ovTitle.textContent = `😢 패! 다시 도전해 보세요`;
      ovDesc.textContent = `${opp.name} 선수에게 졌어요. 코인 1개를 넣고 다시 도전해 보세요!`;
      ovBtn.textContent = '코인 넣고 재도전 (-1 COIN)';
      ovBtn.onclick = () => insertCoinAndStart(stageIdx);
    }
  }, 1050);
}

function updateFighter(f, opp, ctrl) {
  if (f.dodgeCooldown > 0) f.dodgeCooldown--;
  if (f.state !== 'ko' && f.state !== 'hit') f.dir = opp.x >= f.x ? 1 : -1;

  if (f.stateTime > 0) {
    f.stateTime--;
    if ((f.state === 'punch' || f.state === 'kick') && !f.hitApplied && f.stateTime === (f.state === 'punch' ? 9 : 11)) {
      const reach = f.state === 'kick' ? 88 : 68;
      const dx = (opp.x - f.x) * f.dir;
      const dy = Math.abs(opp.y - f.y);
      if (dx > -10 && dx < reach && dy < 72 && opp.state !== 'ko') {
        f.hitApplied = true;
        const isAir = f.y < GROUND_Y - 10;
        let dmg = f.state === 'kick' ? (isAir ? 22 : 16) : 12;
        let label = (f.state === 'kick' && f.isSpinKick) ? '돌려차기!' : (f.state === 'kick' ? '양발차기!' : '양손 펀치!');
        const hitType = isAir && f.state === 'kick' ? 'jump_kick' : f.state;
        if (opp.weakness && (opp.weakness === hitType || (opp.weakness === 'kick' && f.state === 'kick'))) {
          dmg = Math.round(dmg * 1.7);
          label = '약점 명중!';
        }
        applyDamage(f, opp, dmg, f.state === 'kick' ? 10 : 6, label);
      }
    }
    if (f.stateTime === 0 && f.state !== 'ko') f.state = 'idle';
  }

  if (ctrl && gameState === 'fight' && f.state !== 'hit' && f.state !== 'ko') {
    if (ctrl.special && f.energy >= 100) startAttack(f, 'special');
    else if (ctrl.dodge) startDodge(f);
    else if (ctrl.punch) startAttack(f, 'punch');
    else if (ctrl.kick) startAttack(f, 'kick');

    if (f.state === 'idle' || f.state === 'walk' || f.state === 'jump') {
      if (ctrl.left) { f.vx = -f.speed; if (f.y >= GROUND_Y) f.state = 'walk'; }
      else if (ctrl.right) { f.vx = f.speed; if (f.y >= GROUND_Y) f.state = 'walk'; }
      else { f.vx *= 0.6; if (f.y >= GROUND_Y && f.state === 'walk') f.state = 'idle'; }

      if (ctrl.up && f.y >= GROUND_Y) {
        f.vy = -14.2;
        f.state = 'jump';
        beep(340, 0.06, 'sine', 0.05);
      }
    }
  }

  if (!ctrl && gameState === 'fight' && f.state !== 'hit' && f.state !== 'ko') {
    if (f.aiJumpCooldown > 0) f.aiJumpCooldown--;
    const dist = Math.abs(opp.x - f.x);

    const incomingProj = projectiles.find(pr => pr.owner === opp && Math.abs(pr.x - f.x) < 120);
    if (incomingProj && f.y >= GROUND_Y && f.aiJumpCooldown === 0) {
      f.vy = -14.0;
      f.state = 'jump';
      f.aiJumpCooldown = 50;
    }

    if (f.state === 'idle' || f.state === 'walk') {
      if (f.energy >= 100 && dist > 110 && Math.random() < 0.08) {
        startAttack(f, 'special');
      } else if ((opp.state === 'punch' || opp.state === 'kick') && dist < 92 && Math.random() < f.dodgeRate) {
        startDodge(f);
      } else {
        if (dist > 74) { f.vx = f.dir * f.speed * 0.92; f.state = 'walk'; }
        else if (dist < 42) { f.vx = -f.dir * f.speed * 0.6; }
        else { f.vx *= 0.6; f.state = 'idle'; }

        if (dist < 88 && Math.random() < f.aggr) {
          if (Math.random() < 0.18 && f.y >= GROUND_Y && f.aiJumpCooldown === 0) {
            f.vy = -13.5;
            f.state = 'jump';
            f.aiJumpCooldown = 60;
            setTimeout(() => { if (gameState === 'fight' && f.state !== 'ko') startAttack(f, 'kick'); }, 180);
          } else {
            startAttack(f, Math.random() < 0.55 ? 'kick' : 'punch');
          }
        }
      }
    }
  }

  f.x += f.vx;
  f.y += f.vy;
  if (f.y < GROUND_Y) f.vy += 0.78;
  else { f.y = GROUND_Y; f.vy = 0; if (f.state === 'jump') f.state = 'idle'; }
  f.vx *= 0.86;
  f.x = Math.max(55, Math.min(705, f.x));
}

function update() {
  if (isPaused) return;
  if (specBtn1P) specBtn1P.classList.toggle('ready', p1.energy >= 100);
  if (specBtn2P1) specBtn2P1.classList.toggle('ready', p1.energy >= 100);
  if (specBtn2P2) specBtn2P2.classList.toggle('ready', p2.energy >= 100);
  if (p1.comboTimer > 0) { p1.comboTimer--; if (p1.comboTimer === 0) p1.combo = 0; }
  if (p2.comboTimer > 0) { p2.comboTimer--; if (p2.comboTimer === 0) p2.combo = 0; }
  if (gameState === 'fight') {
    timerTick++;
    if (timerTick >= 60) {
      timerTick = 0;
      timer = Math.max(0, timer - 1);
      if (timer === 0) endRound(p1.hp >= p2.hp);
    }
  }
  netSyncTick++;
  if (isOnline2P && netRole === 'guest') {
    if (netConn && netConn.open && netSyncTick % 3 === 0) {
      try { netConn.send({ type: 'input', input }); } catch (e) {}
    }
    return;
  }
  updateFighter(p1, p2, input);
  updateFighter(p2, p1, (is2PMode || isOnline2P) ? input2 : null);
  if (isOnline2P && netRole === 'host' && netConn && netConn.open && netSyncTick % 3 === 0) {
    try {
      netConn.send({
        type: 'state',
        p1: { x: p1.x, y: p1.y, dir: p1.dir, hp: p1.hp, energy: p1.energy, state: p1.state },
        p2: { x: p2.x, y: p2.y, dir: p2.dir, hp: p2.hp, energy: p2.energy, state: p2.state },
        projectiles: projectiles.map(pr => ({ x: pr.x, y: pr.y, color: pr.color, size: pr.size })),
        timer,
        gameState
      });
    } catch (e) {}
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.x += pr.vx; pr.life--;
    const target = pr.owner === p1 ? p2 : p1;
    if (Math.abs(pr.x - target.x) < (24 + pr.size) && Math.abs(pr.y - (target.y - 54)) < (42 + pr.size) && target.state !== 'ko') {
      applyDamage(pr.owner, target, pr.power, 12 + Math.floor(pr.size * 0.2), '필살기!');
      projectiles.splice(i, 1);
      continue;
    }
    if (pr.life <= 0 || pr.x < 0 || pr.x > 760) projectiles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].y -= 0.9; popups[i].life--; if (popups[i].life <= 0) popups.splice(i, 1); }
  for (let i = particles.length - 1; i >= 0; i--) { const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.24; pt.life--; if (pt.life <= 0) particles.splice(i, 1); }
  if (shake > 0) shake *= 0.82;
}

const P = 2; // Finer 16-bit pixel art grid!
function px(c, x, y, w, h, col) {
  c.fillStyle = col;
  c.fillRect(Math.round(x / P) * P, Math.round(y / P) * P, Math.max(P, Math.round(w / P) * P), Math.max(P, Math.round(h / P) * P));
}

function drawFighter3D(f) {
  ctx.save();
  ctx.translate(Math.round(f.x / P) * P, Math.round(f.y / P) * P);
  ctx.scale(f.dir * 1.25, 1.25);

  if (f.state === 'dodge') ctx.globalAlpha = 0.6;

  // Soft floor shadow
  px(ctx, -26, 0, 52, 8, 'rgba(0,0,0,0.45)');

  if (f.state === 'ko') { ctx.rotate(-Math.PI / 2); ctx.translate(20, -20); }
  else if (f.state === 'kick' && f.isSpinKick) {
    const spinProg = (24 - f.stateTime) / 24;
    ctx.translate(0, -45);
    ctx.rotate(spinProg * Math.PI * 2);
    ctx.translate(0, 45);
    px(ctx, -46, -54, 92, 8, '#ffd166');
    px(ctx, -38, -42, 76, 6, '#5ce1e6');
  }
  else if (f.state === 'hit') ctx.rotate(-0.15);
  else if (f.state === 'dodge') ctx.translate(0, 12);

  px(ctx, -28, -28 + bob, 14, 14, '#241a38');

  // Boxing Shorts + White Belt
  px(ctx, -22, -34 + bob, 44, 18, '#241a38');

  px(ctx, 24, 42, 180 * (p1.energy / 100), 8, p1.energy >= 100 ? '#ffd166' : '#ff8fab');

  px(ctx, 446, 18, 290, 20, '#18122b');
  const w2 = Math.max(0, 282 * (p2.hp / p2.maxHp));
  px(ctx, 450 + (282 - w2), 22, w2, 12, '#ff6b8b');

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`1P ${p1.name}`, 26, 66);
  ctx.textAlign = 'right';
  ctx.fillText(`${is2PMode ? '2P' : 'CPU'} ${p2.name}`, 734, 66);
  if (p2.weakHint) {
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 15px monospace';
    ctx.fillText(p2.weakHint, 734, 88);
  }

  ctx.fillStyle = '#ffd166';
  ctx.font = '900 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(String(timer).padStart(2, '0'), 380, 36);
  ctx.fillStyle = '#bfb3de';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(is2PMode ? '2P VS MODE' : `STAGE ${stageIdx + 1}`, 380, 56);
}

function draw() {
  const cfg = getOpponentForStage(stageIdx);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (shake > 0.5) ctx.translate(Math.round((Math.random() - 0.5) * shake / P) * P, Math.round((Math.random() - 0.5) * shake / P) * P);

  drawDojoFurniture(cfg);
  drawFighter3D(p2);
  drawFighter3D(p1);

  projectiles.forEach(pr => {
    const r = pr.size || 18;
    px(ctx, pr.x - r, pr.y - r, r * 2, r * 2, pr.color);
    px(ctx, pr.x - r * 0.5, pr.y - r * 0.5, r, r, '#ffffff');
  });

  particles.forEach(pt => { px(ctx, pt.x - 4, pt.y - 4, 8, 8, pt.color); px(ctx, pt.x - 2, pt.y - 6, 4, 12, '#ffffff'); });
  drawHUD();
  popups.forEach(pp => {
    ctx.fillStyle = pp.color;
    ctx.font = `900 ${Math.min(24, pp.size)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(pp.text, pp.x, pp.y);
  });
  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// Arcade Joystick Logic
const joyBase = document.getElementById('joystickBase');
const joyKnob = document.getElementById('joystickKnob');
let joyActive = false;

function updateJoystick(clientX, clientY) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const maxR = rect.width * 0.34;
  let dx = clientX - cx;
  let dy = clientY - cy;
  if (document.body.classList.contains('force-landscape') && window.innerHeight > window.innerWidth) {
    const tmp = dx;
    dx = dy;
    dy = -tmp;
  }
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) {
    dx = (dx / dist) * maxR;
    dy = (dy / dist) * maxR;
  }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  input.left = dx < -12;
  input.right = dx > 12;
  input.up = dy < -18;
  input.dodge = dy > 20;
}

function resetJoystick() {
  joyActive = false;
  joyKnob.style.transform = 'translate(0px, 0px)';
  input.left = false;
  input.right = false;
  input.up = false;
  input.dodge = false;
}

joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  joyActive = true;
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
joyBase.addEventListener('touchmove', e => {
  e.preventDefault();
  if (joyActive) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
joyBase.addEventListener('touchend', resetJoystick);
joyBase.addEventListener('touchcancel', resetJoystick);

joyBase.addEventListener('mousedown', e => {
  joyActive = true;
  updateJoystick(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if (joyActive) updateJoystick(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
  if (joyActive) resetJoystick();
});

function setupConn(conn) {
  netConn = conn;
  conn.on('data', (msg) => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'hello' && netRole === 'host') {
      guestCharCfg = msg.char || ROSTER[1];
      conn.send({ type: 'start', hostChar: getPlayerChar(), guestChar: guestCharCfg });
      startOnlineMatch();
    } else if (msg.type === 'start' && netRole === 'guest') {
      startOnlineMatch(msg.hostChar, msg.guestChar);
    } else if (msg.type === 'input' && netRole === 'host') {
      Object.assign(input2, msg.input);
    } else if (msg.type === 'state' && netRole === 'guest') {
      if (msg.p1) Object.assign(p1, msg.p1);
      if (msg.p2) Object.assign(p2, msg.p2);
      if (Array.isArray(msg.projectiles)) projectiles = msg.projectiles;
      if (typeof msg.timer === 'number') timer = msg.timer;
      if (msg.gameState && gameState !== 'round_end') gameState = msg.gameState;
    } else if (msg.type === 'game_over' && netRole === 'guest') {
      showOnlineResult(!msg.hostWon);
    } else if (msg.type === 'rematch' && netRole === 'guest') {
      startOnlineMatch(msg.hostChar, msg.guestChar);
    } else if (msg.type === 'rematch_req' && netRole === 'host') {
      if (netConn && netConn.open) netConn.send({ type: 'rematch', hostChar: getPlayerChar(), guestChar: guestCharCfg });
      startOnlineMatch();
    }
  });
  conn.on('close', () => {
    if (isOnline2P) {
      addPopup(380, 180, '연결 끊김', '#ff6b8b', 28);
      closeOnlineSession();
    }
  });
}

function startOnlineMatch(hChar, gChar) {
  isOnline2P = true;
  is2PMode = false;
  onlineModal.classList.add('hidden');
  onlineBtn.style.background = '#ff6b8b';
  onlineBtn.textContent = '👤 혼자';
  onePControls.classList.remove('hidden');
  twoPControls.classList.remove('active');
  overlay.classList.add('hidden');
  p1 = createFighter(true, hChar || getPlayerChar());
  p2 = createFighter(false, { ...(gChar || guestCharCfg), weakness: '', weakHint: '' });
  timer = 99; timerTick = 0; popups = []; particles = []; projectiles = [];
  gameState = 'fight';
  addPopup(380, 185, 'ONLINE VS!', '#5ce1e6', 32);
  startBGM();
}

modalLocal2pBtn.onclick = () => {
  onlineModal.classList.add('hidden');
  set2PMode(true);
};


function playTapSfx() {
  beep(640, 0.025, 'sine', 0.02);
}
document.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest('button')) {
    ensureAudio();
    playTapSfx();
  }
}, { passive: true });

loop();
</script>
</body>
</html>
